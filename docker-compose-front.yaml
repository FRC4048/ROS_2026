services:
  camera1:
    container_name: camera1
    image: "frc4048-ros2"
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - CAM=1
    devices:
      - /dev/video0
    command: ["./start-camera.sh"]
    restart: always
  camera2:
    container_name: camera2
    image: "frc4048-ros2"
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - CAM=2
    devices:
      - /dev/video2
    command: ["./start-camera.sh"]
    restart: always  
  tcp:
    container_name: tcp
    image: "frc4048-ros2"
    network_mode: host
    privileged: true
    environment:
      - SERVER_PORT=5807
    ipc: host
    command: ["./start-tcp.sh"]
    restart: unless-stopped
  lifesigns:
    container_name: lifesigns
    image: "frc4048-ros2"
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - SERVER_SUFFIX=SIDES
    command: ["./start-lifesigns.sh"]
    restart: unless-stopped
